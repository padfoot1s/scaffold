# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Deploys each inswa agent as a Microsoft Foundry hosted agent (same image, different HOSTING__AGENT).
# Values in ${...} come from the azd environment (`azd env set NAME value`). Values without a
# default are required: HOSTING__STRICT makes a container refuse to start when they are empty.

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: inswa-agents

x-agent-env: &agent-env
  # FOUNDRY_PROJECT_ENDPOINT and APPLICATIONINSIGHTS_CONNECTION_STRING are injected by the platform.
  # Reasoning model for every agent role. For Claude: deploy it in the Foundry resource, then
  #   azd env set INSWA_REASONING_MODEL <claude-deployment-name>
  #   azd env set INSWA_REASONING_PROVIDER anthropic
  AZURE_AI_MODEL_DEPLOYMENT_NAME: ${INSWA_REASONING_MODEL=inswa-reasoning}
  FOUNDRY__DEFAULT_PROVIDER: ${INSWA_REASONING_PROVIDER=openai}
  # Light model for the orchestrator's intent-routing step.
  FOUNDRY__MODELS__ROUTER: ${INSWA_ROUTER_MODEL=inswa-router}
  FOUNDRY__PROVIDERS__ROUTER: openai
  AZURE__CREDENTIAL: managed_identity
  AZURE__MANAGED_IDENTITY_CLIENT_ID: ${INSWA_MANAGED_IDENTITY_CLIENT_ID=}
  HOSTING__STRICT: 'true'
  TELEMETRY__EXPORTER: appinsights
  MCP__URL: ${INSWA_MCP_URL}
  MCP__AUTH: entra
  MCP__SCOPE: ${INSWA_MCP_SCOPE}
  COSMOS__PROVIDER: cosmos
  COSMOS__ENDPOINT: ${INSWA_COSMOS_ENDPOINT}
  SEARCH__PROVIDER: ${INSWA_SEARCH_PROVIDER=local}
  SEARCH__ENDPOINT: ${INSWA_SEARCH_ENDPOINT=}
  # Empty = Entra ID auth (preferred). A key set here is stored as plain text in the agent's
  # environment configuration, so prefer granting each agent identity "Search Index Data Reader".
  SEARCH__API_KEY: ${INSWA_SEARCH_API_KEY=}

x-agent-common: &agent-common
  host: azure.ai.agent
  uses:
    - ai-project
  project: .
  language: python
  docker:
    path: Dockerfile
    remoteBuild: true
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  container:
    resources:
      cpu: '0.5'
      memory: 1Gi

services:
  ai-project:
    host: azure.ai.project
    # Two models: a light router and a reasoning model shared by all agent roles. A single role
    # can still get its own deployment with FOUNDRY__MODELS__<ROLE> / FOUNDRY__PROVIDERS__<ROLE>.
    deployments:
      - name: inswa-router
        model: {format: OpenAI, name: gpt-5.4-mini, version: '2026-03-17'}
        sku: {name: GlobalStandard, capacity: 10}
      # Stand-in until the Claude deployment exists (see INSWA_REASONING_MODEL above).
      - name: inswa-reasoning
        model: {format: OpenAI, name: gpt-5.4-mini, version: '2026-03-17'}
        sku: {name: GlobalStandard, capacity: 10}
      # Claude: confirm the model name, version and SKU in your region's Foundry model catalog.
      # - name: inswa-claude
      #   model: {format: Anthropic, name: <claude-model>, version: '<version>'}
      #   sku: {name: GlobalStandard, capacity: 1}

  inswa-orchestrator:
    <<: *agent-common
    name: inswa-orchestrator
    description: Answers weekly demand forecast questions and composes grounded answers from specialists.
    env:
      <<: *agent-env
      HOSTING__AGENT: orchestrator
      # Call specialists as separate hosted agents instead of in-process:
      AGENTS__FORECASTING__TRANSPORT: ${INSWA_SPECIALIST_TRANSPORT=inprocess}
      AGENTS__VARIANCE_ANALYSIS__TRANSPORT: ${INSWA_SPECIALIST_TRANSPORT=inprocess}
      AGENTS__STATISTICAL_EXPLAINABILITY__TRANSPORT: ${INSWA_SPECIALIST_TRANSPORT=inprocess}
      AGENTS__RCA__TRANSPORT: ${INSWA_SPECIALIST_TRANSPORT=inprocess}
      AGENTS__MARKET_RECOMMENDATIONS__TRANSPORT: ${INSWA_SPECIALIST_TRANSPORT=inprocess}

  inswa-forecasting:
    <<: *agent-common
    name: inswa-forecasting
    description: Weekly volume forecast per SKU and primary customer.
    env:
      <<: *agent-env
      HOSTING__AGENT: forecasting

  inswa-variance-analysis:
    <<: *agent-common
    name: inswa-variance-analysis
    description: Weekly forecast vs actuals variance.
    env:
      <<: *agent-env
      HOSTING__AGENT: variance_analysis

  inswa-statistical-explainability:
    <<: *agent-common
    name: inswa-statistical-explainability
    description: Forecast driver explanations.
    env:
      <<: *agent-env
      HOSTING__AGENT: statistical_explainability

  inswa-rca:
    <<: *agent-common
    name: inswa-rca
    description: Root causes of forecast misses.
    env:
      <<: *agent-env
      HOSTING__AGENT: rca

  inswa-market-recommendations:
    <<: *agent-common
    name: inswa-market-recommendations
    description: Planner recommendations from root-cause findings.
    env:
      <<: *agent-env
      HOSTING__AGENT: market_recommendations

  # Disabled agent (market trend): enable the flag (AGENTS__MARKET_TREND__ENABLED=true) and
  # add a service like the ones above with HOSTING__AGENT: market_trend.

infra:
  provider: microsoft.foundry
