[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inswa"
version = "0.1.0"
description = "Agent layer for forecasting, variance and explainability insights on Microsoft Agent Framework (Foundry hosted agents)."
readme = "README.md"
requires-python = ">=3.11"
# Agent Framework packages are pinned exactly (the hosting and Anthropic packages are betas;
# naming a prerelease version here is enough for pip, no --pre needed). Everything else is
# locked in requirements.lock, which the Dockerfile installs.
dependencies = [
    "agent-framework-core==1.24.0",
    "agent-framework-foundry==1.16.0",
    "agent-framework-foundry-hosting==1.0.0b261030",
    "agent-framework-anthropic==1.0.0b261030",
    "mcp>=2.2,<3",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "azure-identity>=1.19",
    "azure-cosmos>=4.9",
    "azure-search-documents>=11.6",
    "aiohttp>=3.10",
    "azure-monitor-opentelemetry>=1.8.10,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
inswa = "inswa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
